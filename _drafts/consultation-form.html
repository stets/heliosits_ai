<!-- Unpublished FormSubmit draft. Requires inbox activation and verified delivery before use. -->
<form class="cta-form" id="contact-form" action="https://formsubmit.co/hello@heliositservices.com" method="POST">
        <input type="hidden" name="_subject" value="Helios AI — new consultation request">
        <input type="hidden" name="_next" value="https://heliositservices.com/thank-you/">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" class="form-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="source_page" value="">
        <input type="hidden" name="referrer" value="">
        <input type="hidden" name="utm_source" value="">
        <input type="hidden" name="utm_medium" value="">
        <input type="hidden" name="utm_campaign" value="">
        <div class="form-row">
          <label>Your name<input type="text" name="name" autocomplete="name" maxlength="120" required></label>
          <label>Email address<input type="email" name="email" autocomplete="email" maxlength="254" required></label>
        </div>
        <div class="form-row">
          <label>Company <span>(optional)</span><input type="text" name="company" autocomplete="organization" maxlength="160"></label>
          <label>What do you need help with?<select name="interest" required><option value="" disabled selected>Choose a service</option><option value="Claude setup &amp; integration">Claude setup &amp; integration</option><option value="Workflow automation">Workflow automation</option><option value="Team training">Team training</option><option value="AI strategy">AI strategy</option><option value="Not sure yet">Not sure yet</option></select></label>
        </div>
        <label>What task would you like to improve?<textarea name="message" rows="4" minlength="10" maxlength="5000" placeholder="For example: We copy customer emails into our CRM by hand. We use Gmail and HubSpot." required></textarea></label>
        <p class="form-note">We'll use these details to respond to your inquiry. Please leave out passwords and confidential customer data. See our <a href="/privacy/">privacy notice</a>.</p>
        <button type="submit" class="btn btn-full">Request a free discovery call</button>
        <p class="form-note form-fallback">Prefer email? <a href="mailto:hello@heliositservices.com">hello@heliositservices.com</a>. If the form doesn't complete, email us directly.</p>
      </form>
